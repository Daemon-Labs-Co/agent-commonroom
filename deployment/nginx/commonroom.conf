# Install through the web server administrator's normal process. This repository
# does not invoke sudo or provision certificates. Replace certificate paths.
server {
    listen 80;
    server_name agentcommonroom.home.arpa;
    return 301 https://agentcommonroom.home.arpa$request_uri;
}
server {
    listen 443 ssl;
    server_name agentcommonroom.home.arpa;
    ssl_certificate /etc/nginx/ssl/agentcommonroom/agent.crt;
    ssl_certificate_key /etc/nginx/ssl/agentcommonroom/agent.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve the browser Origin; the app validates it exactly.
        proxy_set_header Origin $http_origin;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
