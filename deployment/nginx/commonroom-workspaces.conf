# Hosting many workspaces (COMMONROOM_TENANCY=multi). Install through the web server
# administrator's normal process; this repository does not invoke sudo or provision
# certificates. Replace the domain and certificate paths.
#
# Needs wildcard DNS (*.rooms.example.com and platform.rooms.example.com -> this server)
# and one certificate that covers *.rooms.example.com. The application derives each
# workspace from the Host header, so the proxy must forward it unchanged.
# Burst protection ahead of the application's own per-workspace limits. This directive
# belongs at http level, so keep it outside the server blocks.
limit_req_zone $binary_remote_addr zone=workspaces:10m rate=30r/s;

server {
    listen 80;
    server_name *.rooms.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name *.rooms.example.com;
    ssl_certificate /etc/nginx/ssl/rooms/wildcard.crt;
    ssl_certificate_key /etc/nginx/ssl/rooms/wildcard.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location / {
        limit_req zone=workspaces burst=60 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve the browser Origin; the app validates it exactly per workspace.
        proxy_set_header Origin $http_origin;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
