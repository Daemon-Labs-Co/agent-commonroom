<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Room · Workflow demo</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#24313c;background:#f4f5f1}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #cdd4d1;background:white;padding:9px 13px;border-radius:7px;color:inherit}button:hover{background:#e8efe9}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#244c40;color:white;border-color:#244c40}.danger{color:#a62e2e}header{padding:17px 25px;background:white;border-bottom:1px solid #dfe3dd;display:flex;align-items:center;gap:18px}header strong{font-size:21px}header span{font-size:12px;color:#67756c}.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 65px)}nav{padding:25px 15px;background:#e9ede6}nav button{display:block;width:100%;text-align:left;margin:7px 0;background:transparent;border:0}nav button.active{background:#d2dfd3;font-weight:650}nav small{display:block;margin:30px 12px 10px;color:#687569}main{padding:28px;max-width:1500px;width:100%}h1{font-size:27px;margin:0 0 7px}h2{font-size:18px}p{line-height:1.55}.sub{color:#6b7770;font-size:14px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 300px;gap:20px}.card{background:white;border:1px solid #dfe4dc;border-radius:12px;padding:20px;margin-bottom:16px}.tag{font-size:12px;background:#e5eee6;color:#315443;padding:4px 8px;border-radius:20px;display:inline-block}.tag.warn{background:#fff0cf;color:#815b12}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}.muted{color:#77827c;font-size:12px}.message{border-bottom:1px solid #edf0e9;padding:15px 0}.message:last-child{border:0}.message p{margin:8px 0}.avatar{display:inline-grid;place-items:center;width:30px;height:30px;background:#e6eae3;border-radius:7px;margin-right:8px;font-size:13px;font-weight:700}.compose{display:flex;gap:9px;margin-top:15px}.compose input{flex:1}.field{display:block;margin:14px 0}.field input,.field textarea,.field select,input,select{padding:9px;border:1px solid #ccd4cc;border-radius:6px;background:white} .field input,.field textarea,.field select{display:block;width:100%;margin-top:6px}textarea{min-height:80px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:13px 8px;border-bottom:1px solid #e5e9e2}dialog{width:min(540px,90vw);border:1px solid #d3dbd1;border-radius:14px;padding:25px;box-shadow:0 20px 70px #22352b44}dialog::backdrop{background:#172d2766}.banner{background:#fce7e5;color:#8a2424;padding:16px;border:1px solid #e4aaa6;border-radius:9px;margin-bottom:20px}.toast{position:fixed;bottom:22px;right:22px;background:#243e32;color:white;padding:14px 20px;border-radius:9px;max-width:420px} .actions{display:flex;gap:8px;flex-wrap:wrap}a{color:#315e49}@media(max-width:850px){.shell{grid-template-columns:1fr}nav{display:flex;gap:5px;padding:8px;overflow:auto}nav small{display:none}nav button{white-space:nowrap;width:auto}.grid{grid-template-columns:1fr}main{padding:18px}.toolbar{align-items:flex-start;flex-wrap:wrap}table{font-size:12px}header{flex-wrap:wrap}}
</style><header><strong>◈ Agent Room</strong><span>LOCAL WORKFLOW DEMO · Simulated agents · No backend enforcement</span></header><div class="shell"><nav id="nav"></nav><main id="main"></main></div><dialog id="modal"></dialog><div id="toast" class="toast" hidden role="status"></div><script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let view='Room',incident=false,retention='30 days',memoryFilter='All';let connections=[{name:'Claude Code',protocol:'Local CLI',status:'Ready'},{name:'Jerry / Codex',protocol:'Local CLI',status:'Ready'},{name:'Gemini',protocol:'HTTP',status:'Not tested'},{name:'ChatGPT assistant',protocol:'MCP',status:'Integration unverified'}];let bots=[{name:'Jerry',role:'Developer',rank:2,status:'Idle',accept:false},{name:'Claude',role:'QA reviewer',rank:2,status:'Idle',accept:true}];let messages=[{name:'You',text:'Build the agent-room workflow. Jerry develops; Claude reviews.',trashed:false,age:0},{name:'Jerry',text:'I’ll prepare the implementation and submit it for review.',trashed:false,age:0},{name:'Claude',text:'I’ll verify isolation, memory conflict handling, and retention.',trashed:false,age:0}];let memories=[{title:'Room boundary',body:'Allowed: /workspace/agent-room (read/write), /references (read).',scope:'Room',conflict:false},{title:'Backend direction',body:'Go backend, TypeScript interface, PostgreSQL.',scope:'Project',conflict:false},{title:'Human authority',body:'Humans decide. Committed history cannot be rewritten.',scope:'Application',conflict:false}];let task='Working',logs=['Room created by human','Jerry and Claude invited with independent sessions'];let dirs=[{path:'/workspace/agent-room',access:'Read/write'},{path:'/references',access:'Read'}];
function note(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').hidden=true,4000)}function log(t){logs.push(new Date().toLocaleTimeString()+' · '+t)}function dialog(title,body,save){$('#modal').innerHTML='<h2>'+title+'</h2>'+body+'<div class="actions"><button class="primary" id="save">Save</button><button id="close">Cancel</button></div>';$('#close').onclick=()=>$('#modal').close();$('#save').onclick=save;$('#modal').showModal()}function agentAction(fn){if(incident){note('Agent actions blocked during integrity incident');return}fn()}
function render(){ $('#nav').innerHTML=['Room','Connections','Shared memory','History & retention','Settings'].map(v=>'<button class="'+(v===view?'active':'')+'" data-view="'+v+'">'+v+'</button>').join('')+'<small>PROJECT</small><p style="margin:12px;font-size:14px">Harness prototype<br><span class="muted">1 room · single-user</span></p>';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});let html=incident?'<div class="banner"><strong>Integrity incident · Human access only</strong><br>All agents disconnected. Reconnection and invitations blocked until human recovery. <button onclick="view=\'History & retention\';render()">Inspect logs</button></div>':'';
if(view==='Room')html+=`<div class="toolbar"><div><h1>Engineering room</h1><div class="sub">Harness prototype / Directed participation</div></div><div class="actions"><button onclick="status()" ${incident?'disabled':''}>Request squad status</button><button class="primary" onclick="invite()" ${incident?'disabled':''}>Invite agent</button></div></div><div class="grid"><section><div class="card"><div class="row"><strong>Conversation</strong><span class="tag">Append-only history</span></div>${messages.filter(m=>!m.trashed).map(m=>`<div class="message"><strong><span class="avatar">${esc(m.name[0])}</span>${esc(m.name)}</strong><p>${esc(m.text)}</p><span class="muted">Committed · Demo record</span></div>`).join('')}<form class="compose" id="compose"><input aria-label="Message" name="message" placeholder="Message the squad or @mention an agent…" required><button class="primary">Send</button></form></div><div class="card"><div class="row"><h2>Task · Build functional workflow</h2><span class="tag">${task}</span></div><p class="sub">Developer: Jerry · QA: Claude · Acceptance authority: Claude and human</p><div class="actions"><button onclick="taskAction('Submitted')" ${incident?'disabled':''}>Simulate submission</button><button onclick="taskAction('Reviewing')" ${incident?'disabled':''}>Start QA</button><button onclick="taskAction('Changes requested')" ${incident?'disabled':''}>QA requests changes</button><button onclick="taskAction('Accepted')">Accept as human</button></div></div></section><aside><div class="card"><h2>Squad</h2>${bots.map((b,i)=>`<div style="padding:12px 0;border-bottom:1px solid #eee"><div class="row"><strong>${esc(b.name)}</strong><span class="tag">${b.status}</span></div><div class="sub">${esc(b.role)} · Seniority ${b.rank}</div><div class="actions" style="margin-top:10px"><button onclick="profile(${i})">Profile</button><button onclick="kick(${i})" ${incident?'disabled':''}>Kick</button></div></div>`).join('')}</div><div class="card"><h2>Directory boundary</h2>${dirs.map(d=>`<p><code>${esc(d.path)}</code><br><span class="muted">${d.access}</span></p>`).join('')}<button onclick="directory()">Edit access</button></div></aside></div>`;
if(view==='Connections')html+=`<div class="toolbar"><div><h1>Agent connections</h1><div class="sub">Plug in once. Assign profiles when invited to a room.</div></div><button class="primary" onclick="connection()">Plug in agent</button></div><div class="card"><table><thead><tr><th>Connection</th><th>Transport</th><th>Status</th><th></th></tr></thead><tbody>${connections.map((c,i)=>`<tr><td>${esc(c.name)}</td><td>${esc(c.protocol)}</td><td><span class="tag">${esc(c.status)}</span></td><td><button onclick="test(${i})" ${incident?'disabled':''}>Simulate test</button></td></tr>`).join('')}</tbody></table><p class="muted">Tests and capabilities are simulated; no credentials are collected.</p></div>`;
if(view==='Shared memory')html+=`<div class="toolbar"><div><h1>Shared memory</h1><div class="sub">Durable context · revisions preserved · humans decide conflicts</div></div><button class="primary" onclick="memory()">Write memory</button></div><div class="actions" style="margin-bottom:20px">${['All','Room','Project','Application'].map(s=>`<button onclick="memoryFilter='${s}';render()" class="${s===memoryFilter?'primary':''}">${s}</button>`).join('')}</div>${memories.map((m,i)=>({m,i})).filter(({m})=>memoryFilter==='All'||m.scope===memoryFilter).map(({m,i})=>`<div class="card"><div class="row"><h2>${esc(m.title)}</h2><span class="tag">${m.scope}</span></div><p>${esc(m.body)}</p><p class="muted">Source: Engineering room · Revision ${m.rev||1}</p>${m.conflict?'<p class="tag warn">Disputed · Awaiting human direction · Equal seniority requires consensus after timeout</p>':''}<div class="actions"><button onclick="memory(${i})">Edit / new revision</button><button onclick="conflict(${i})">${m.conflict?'Resolve as human':'Simulate conflict'}</button></div></div>`).join('')}`;
if(view==='History & retention')html+=`<div class="toolbar"><div><h1>History & retention</h1><div class="sub">Trash is reversible. Purge requires a human and expired protection.</div></div><span class="tag ${incident?'warn':''}">${incident?'Verification failed':'Integrity healthy · simulated'}</span></div><div class="card"><label>Retention <select id="retention">${['30 days','2 months','3 months','6 months','1 year','2 years','3 years','4 years','5 years','Forever'].map(r=>`<option ${r===retention?'selected':''}>${r}</option>`).join('')}</select></label><p class="muted">Rolling from commitment. Demo presets; lowering retention cannot shorten an existing enforced lock.</p><button onclick="messages.push({name:'You',text:'Example record committed 45 days ago',age:45,trashed:true});render()">Add expired trash example</button></div>${messages.map((m,i)=>`<div class="card"><div class="row"><strong>${esc(m.name)} · ${m.age} days old</strong><span class="tag">${m.trashed?'Trashed':'Retained'}</span></div><p>${esc(m.text)}</p><div class="actions"><button onclick="trash(${i})">${m.trashed?'Restore':'Trash'}</button><button class="danger" onclick="purge(${i})" ${!eligible(m)?'disabled':''}>Purge as human</button></div></div>`).join('')}<div class="card"><h2>Audit events</h2>${logs.map(l=>'<p class="muted">'+esc(l)+'</p>').join('')}</div>`;
if(view==='Settings')html+=`<h1>Room controls</h1><div class="card"><h2>Kicker policy</h2><label class="field">Acknowledgement timeout (seconds)<input type="number" min="1" value="30"></label><label class="field">Activity timeout (seconds)<input type="number" min="1" value="120"></label><label class="field">Retry limit<input type="number" min="0" value="2"></label><label class="field">Human decision timeout (seconds)<input type="number" min="1" value="300"></label><button onclick="log('Human updated room timeout policy');note('Policy saved for this demo');render()">Save policy</button></div><div class="card"><h2>Integrity incident demonstration</h2><p>Simulate a committed-record checksum mismatch. Disconnect all agents and block agent access across the application.</p><button class="danger" onclick="incident=true;bots.forEach(b=>b.status='Disconnected');log('INTEGRITY FAILURE: simulated checksum mismatch; all agents disconnected');render()" ${incident?'disabled':''}>Simulate integrity failure</button> <button onclick="incident=false;log('Human authorized recovery; agents remain disconnected pending invitation');render();note('Recovery authorized. Re-invite agents explicitly.')" ${!incident?'disabled':''}>Authorize recovery as human</button></div>`;
$('#main').innerHTML=html;if($('#compose'))$('#compose').onsubmit=e=>{e.preventDefault();messages.push({name:'You',text:e.target.message.value,age:0,trashed:false});log('Human message appended');render()};if($('#retention'))$('#retention').onchange=e=>{retention=e.target.value;log('Human selected retention '+retention);render()};}
function status(){agentAction(()=>{messages.push({name:'Squad status',text:bots.map(b=>b.name+': '+b.status+' (runner-reported)').join(' · '),age:0,trashed:false});log('Human requested squad status');render()})}function taskAction(s){if(s!=='Accepted'&&incident)return;task=s;log('Task → '+s+(s==='Accepted'?' by human':''));render()}function kick(i){agentAction(()=>{bots[i].status='Working';log('Manual kick: '+bots[i].name+'; simulated wakeup acknowledged');render();note('Wakeup acknowledged · no duplicate task')})}
function profile(i){let b=bots[i];dialog('Room profile · '+esc(b.name),`<label class="field">Name<input id="pname" value="${esc(b.name)}"></label><label class="field">Role<input id="prole" value="${esc(b.role)}"></label><label class="field">Instructions<textarea id="instructions">${esc(b.instructions||'Work within room directories. Save useful findings to shared memory.')}</textarea></label><label class="field">Seniority (higher ranks first)<input id="rank" type="number" value="${b.rank}"></label><label><input id="accept" type="checkbox" ${b.accept?'checked':''}> Authorized to accept work</label>`,()=>{Object.assign(b,{name:$('#pname').value,role:$('#prole').value,rank:Number($('#rank').value),instructions:$('#instructions').value,accept:$('#accept').checked});log('Human appended profile revision for '+b.name);$('#modal').close();render()})}
function invite(){agentAction(()=>dialog('Invite an agent',`<label class="field">Configured connection<select id="conn">${connections.map(c=>'<option>'+esc(c.name)+'</option>').join('')}</select></label><label class="field">Session choice<select id="session"><option>New session</option><option>Resume existing conversation (demo)</option><option>Import transcript (demo)</option></select></label><label class="field">Room name<input id="alias" placeholder="e.g. Gemini researcher"></label><label class="field">Role<input id="role" value="Researcher"></label><label class="field">Seniority<input type="number" id="rank" value="1"></label><p class="muted">Live attachment requires adapter verification. Independent session for this membership.</p>`,()=>{bots.push({name:$('#alias').value||$('#conn').value,role:$('#role').value,rank:Number($('#rank').value),status:'Idle',accept:false});log('Human invited agent: '+$('#session').value);$('#modal').close();render()}))}
function connection(){dialog('Plug in agent',`<label class="field">Connection name<input id="cname"></label><label class="field">Transport<select id="protocol"><option>HTTP</option><option>WebSocket</option><option>MCP</option><option>Local CLI</option></select></label><label class="field">Endpoint or executable<input id="endpoint" placeholder="https://agent.example / executable"></label>`,()=>{if(!$('#cname').value.trim())return;connections.push({name:$('#cname').value,protocol:$('#protocol').value,status:'Not tested'});log('Human registered connection');$('#modal').close();render()})}function test(i){agentAction(()=>{connections[i].status='Ready (simulated)';render();note('Simulated connection check passed')})}
function memory(i){let m=memories[i]||{title:'',body:'',scope:'Room'};dialog(i===undefined?'Write shared memory':'Append memory revision',`<label class="field">Title<input id="mtitle" value="${esc(m.title)}"></label><label class="field">Scope<select id="scope">${['Room','Project','Application'].map(s=>`<option ${s===m.scope?'selected':''}>${s}</option>`).join('')}</select></label><label class="field">Context<textarea id="body">${esc(m.body)}</textarea></label>`,()=>{let n={title:$('#mtitle').value,body:$('#body').value,scope:$('#scope').value,rev:(m.rev||0)+1,conflict:m.conflict||false};if(i===undefined)memories.push(n);else memories[i]=n;log('Human appended memory revision: '+n.title);$('#modal').close();render()})}function conflict(i){if(memories[i].conflict){dialog('Human conflict direction','<p>Both competing revisions remain in history.</p><label class="field">Decision<textarea id="decision" placeholder="Describe the authoritative resolution"></textarea></label>',()=>{if(!$('#decision').value.trim())return;memories[i].body=$('#decision').value;memories[i].conflict=false;memories[i].rev=(memories[i].rev||1)+1;log('Human resolved memory conflict');$('#modal').close();render()})}else{memories[i].conflict=true;log('Memory conflict opened; human direction requested');render()}}
function directory(){dialog('Room directory boundary',`<p class="sub">Expansion requires human action. Narrowing pauses work pending enforcement.</p><label class="field">Directories, one per line<textarea id="dirs">${dirs.map(d=>d.path+' | '+d.access).join('\n')}</textarea></label>`,()=>{dirs=$('#dirs').value.split('\n').filter(Boolean).map(s=>{let [path,access]=s.split('|');return{path:path.trim(),access:access?.trim()||'Read'}});bots.forEach(b=>{if(b.status==='Working')b.status='Paused'});log('Human changed directory boundary; affected work paused pending enforcement');$('#modal').close();render()})}
function eligible(m){const days={'30 days':30,'2 months':62,'3 months':93,'6 months':186,'1 year':366,'2 years':732,'3 years':1098,'4 years':1464,'5 years':1830,'Forever':Infinity};return m.trashed&&m.age>=days[retention]}function trash(i){messages[i].trashed=!messages[i].trashed;log('Human '+(messages[i].trashed?'trashed':'restored')+' record; original preserved');render()}function purge(i){if(!eligible(messages[i]))return;dialog('Confirm permanent purge',`<p>Human authorization is required. This eligible trashed record will be removed from the demo; an audit receipt remains.</p>`,()=>{log('Human authorized purge receipt: '+messages[i].name+' / '+messages[i].age+' days old');messages.splice(i,1);$('#modal').close();render()})}render();
</script></html>
