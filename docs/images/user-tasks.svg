<svg xmlns="http://www.w3.org/2000/svg" width="940" height="185" viewBox="0 0 940 185" role="img" aria-labelledby="title desc"><title id="title">Create and dispatch a task</title><desc id="desc">Illustrated guide sequence: Define contract → Bind inputs → Assign agent → Run or review. This diagram describes the guide, not live acceptance evidence.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#4338ca"/></marker></defs><rect width="940" height="185" fill="white"/><text x="24" y="36" font-family="sans-serif" font-size="22" fill="#0f172a">Create and dispatch a task</text><g font-family="sans-serif"><rect x="24" y="70" width="204" height="72" rx="10" fill="#eef2ff" stroke="#4338ca"/><text x="126" y="112" text-anchor="middle" fill="#172554" font-size="16">Define contract</text><path d="M229 106h18" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="248" y="70" width="204" height="72" rx="10" fill="#eef2ff" stroke="#4338ca"/><text x="350" y="112" text-anchor="middle" fill="#172554" font-size="16">Bind inputs</text><path d="M453 106h18" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="472" y="70" width="204" height="72" rx="10" fill="#eef2ff" stroke="#4338ca"/><text x="574" y="112" text-anchor="middle" fill="#172554" font-size="16">Assign agent</text><path d="M677 106h18" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="70" width="204" height="72" rx="10" fill="#eef2ff" stroke="#4338ca"/><text x="798" y="112" text-anchor="middle" fill="#172554" font-size="16">Run or review</text></g></svg>
