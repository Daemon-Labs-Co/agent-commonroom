<svg xmlns="http://www.w3.org/2000/svg" width="940" height="230" viewBox="0 0 940 230" role="img" aria-labelledby="title desc">
<title id="title">Claude browser sign-in guide</title><desc id="desc">Start the isolated Claude CLI, approve on Claude's official page, paste its authorization code into CommonRoom, then finish with Done.</desc><rect width="940" height="230" rx="16" fill="#f5f7ff"/>
<g font-family="sans-serif" fill="#202b49"><text x="25" y="34" font-size="20" font-weight="bold">Claude sign-in — guide illustration</text><g fill="white" stroke="#3155e7" stroke-width="2"><rect x="20" y="60" width="210" height="120" rx="12"/><rect x="250" y="60" width="210" height="120" rx="12"/><rect x="480" y="60" width="210" height="120" rx="12"/><rect x="710" y="60" width="210" height="120" rx="12"/></g><g font-size="16"><text x="35" y="90" font-weight="bold">1. Start sign-in</text><text x="35" y="120">CommonRoom starts</text><text x="35" y="145">the isolated Claude CLI.</text><text x="265" y="90" font-weight="bold">2. Approve at Claude</text><text x="265" y="120">Open the official link.</text><text x="265" y="145">Copy its authorization code.</text><text x="495" y="90" font-weight="bold">3. Submit the code</text><text x="495" y="120">Paste into CommonRoom.</text><text x="495" y="145">The CLI completes sign-in.</text><text x="725" y="90" font-weight="bold">4. Done</text><text x="725" y="120">Credentials saved.</text><text x="725" y="145">Test the connection next.</text></g><text x="25" y="211" font-size="14">Passwords stay on Claude’s page. Authorization codes are transient and are not saved in room history.</text></g>
</svg>
