<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230" role="img" aria-labelledby="title desc">
<title id="title">Codex browser sign-in guide</title><desc id="desc">CommonRoom starts the isolated worker, displays an OpenAI verification link and code, and saves credentials after the user approves on OpenAI's website.</desc>
<rect width="920" height="230" rx="16" fill="#f5f7ff"/>
<g font-family="sans-serif" fill="#202b49"><text x="28" y="35" font-size="20" font-weight="bold">Codex sign-in — guide illustration</text>
<g fill="white" stroke="#3155e7" stroke-width="2"><rect x="25" y="65" width="200" height="115" rx="12"/><rect x="248" y="65" width="200" height="115" rx="12"/><rect x="471" y="65" width="200" height="115" rx="12"/><rect x="694" y="65" width="200" height="115" rx="12"/></g>
<g font-size="16"><text x="40" y="94" font-weight="bold">1. Start sign-in</text><text x="40" y="123">CommonRoom starts</text><text x="40" y="147">the isolated worker.</text><text x="263" y="94" font-weight="bold">2. See link and code</text><text x="263" y="123">Instructions appear</text><text x="263" y="147">in your browser.</text><text x="486" y="94" font-weight="bold">3. Approve at OpenAI</text><text x="486" y="123">Open the official link.</text><text x="486" y="147">Enter the code there.</text><text x="709" y="94" font-weight="bold">4. Credentials saved</text><text x="709" y="123">Return to CommonRoom.</text><text x="709" y="147">Test the connection.</text></g><text x="28" y="211" font-size="14">Your browser computer needs no terminal. Passwords stay on the provider’s website.</text></g>
</svg>
